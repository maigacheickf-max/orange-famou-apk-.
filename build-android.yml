name: Build Orange Famou Burkina (APK Android)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Java (nécessaire pour Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Installer les dépendances npm
        run: npm install

      - name: Ajouter la plateforme Android (génère le dossier android/)
        run: npx cap add android

      - name: Copier le contenu web vers Android
        run: npx cap sync android

      - name: Appliquer l'icône de l'app sur toutes les résolutions
        run: python3 scripts/apply_icon.py

      - name: Autoriser l'exécution de Gradle
        run: chmod +x android/gradlew

      - name: Construire l'APK (debug, installable directement)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publier l'APK comme artefact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFamouBurkina-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
